name: Temporary x402 Availability Diagnostic

on:
  push:
    branches:
      - diag/x402-availability-20260927

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe no-charge availability
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/request.json <<'JSON'
          {
            "schema_version": "geomacro.agent-query.v1",
            "question": "Should a treasury payment involving the United States proceed based on the current Geomacro Risk Gate?",
            "subjects": [{ "type": "country", "country_iso3": "USA" }],
            "topics": ["risk_object", "risk_gate"],
            "evidence": "required",
            "detail": "standard",
            "risk_gate_context": {
              "policy_preset": "balanced",
              "action_type": "treasury_payment",
              "amount_usdc": 1000
            },
            "client_request_id": "temporary-diagnostic-no-charge"
          }
          JSON

          status="$(curl --silent --show-error --max-time 30 \
            -X POST 'https://geomacro.live/api/x402/risk/availability' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data-binary @/tmp/request.json \
            --dump-header /tmp/headers.txt \
            --output /tmp/body.json \
            --write-out '%{http_code}')"

          echo "HTTP_STATUS=$status"
          echo '--- response body ---'
          cat /tmp/body.json
          echo
          echo '--- selected headers ---'
          grep -Ei '^(content-type|cache-control|server|x-|cf-|via):' /tmp/headers.txt || true

          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/body.json', 'utf8');
          try {
            const body = JSON.parse(raw);
            console.log('PARSED_SUMMARY=' + JSON.stringify({
              ok: body.ok,
              chargeable: body.chargeable,
              error: body.error ?? null,
              availability: body.availability ?? null,
              query_plan_hash: body.query_plan_hash ?? null,
              exact_price: body.exact_price ?? null,
            }));
          } catch (error) {
            console.log('PARSE_ERROR=' + String(error));
          }
          NODE

name: Temporary x402 Testnet Security Fallback Patch

on:
  push:
    branches:
      - fix/x402-testnet-security-degraded-fallback

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/x402-testnet-security-degraded-fallback
          persist-credentials: true
          fetch-depth: 1

      - name: Apply narrow testnet-only degraded fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/lib/central-security.server.ts')
          source = source_path.read_text()

          helper = '''export function isCoinbaseTestnetLocalSecurityFallbackAllowed(\n  pathnameInput: string,\n  routeClass: CentralSecurityRouteClass,\n): boolean {\n  const coinbaseEnvironment =\n    process.env.COINBASE_X402_ENVIRONMENT?.trim().toLowerCase();\n\n  return (\n    routeClass === "payment" &&\n    normalizedPathname(pathnameInput).startsWith("/api/x402") &&\n    coinbaseEnvironment === "testnet"\n  );\n}\n\n\n'''

          if 'isCoinbaseTestnetLocalSecurityFallbackAllowed' not in source:
              needle = '''function normalizedPathname(pathname: string): string {\n  const value = String(pathname || "/").split("?", 1)[0] || "/";\n  return value.startsWith("/") ? value : `/${value}`;\n}\n\n\n'''
              if source.count(needle) != 1:
                  raise SystemExit('normalizedPathname insertion point not found exactly once')
              source = source.replace(needle, needle + helper, 1)

          fallback_marker = 'CENTRAL_SECURITY_TESTNET_LOCAL_DEGRADED_PASS'
          if fallback_marker not in source:
              needle = '''    if (policy.failClosed) {\n      return {\n        allowed: false,\n        status: 503,\n        code: "CENTRAL_SECURITY_UNAVAILABLE",\n        routeClass,\n      };\n    }\n'''
              replacement = '''    if (\n      isCoinbaseTestnetLocalSecurityFallbackAllowed(\n        input.pathname,\n        routeClass,\n      )\n    ) {\n      return {\n        allowed: true,\n        status: 200,\n        code: "CENTRAL_SECURITY_TESTNET_LOCAL_DEGRADED_PASS",\n        routeClass,\n      };\n    }\n\n''' + needle
              if source.count(needle) != 1:
                  raise SystemExit('failClosed replacement point not found exactly once')
              source = source.replace(needle, replacement, 1)

          source_path.write_text(source)

          test_path = Path('src/__tests__/central-security-contract.test.ts')
          test = test_path.read_text()

          if 'isCoinbaseTestnetLocalSecurityFallbackAllowed,' not in test:
              needle = '''  enforceCentralRequestSecurity,\n  realFundsSecurityState,\n'''
              replacement = '''  enforceCentralRequestSecurity,\n  isCoinbaseTestnetLocalSecurityFallbackAllowed,\n  realFundsSecurityState,\n'''
              if test.count(needle) != 1:
                  raise SystemExit('test import insertion point not found exactly once')
              test = test.replace(needle, replacement, 1)

          test_name = 'allows local degraded security only for Coinbase x402 testnet paths'
          if test_name not in test:
              needle = '''  it("covers Risk Gate, commercial APIs, internal APIs and server functions centrally", () => {\n'''
              block = '''  it("allows local degraded security only for Coinbase x402 testnet paths", () => {\n    process.env.COINBASE_X402_ENVIRONMENT = "testnet";\n\n    expect(\n      isCoinbaseTestnetLocalSecurityFallbackAllowed(\n        "/api/x402/risk/availability",\n        "payment",\n      ),\n    ).toBe(true);\n    expect(\n      isCoinbaseTestnetLocalSecurityFallbackAllowed(\n        "/api/x402/intelligence",\n        "payment",\n      ),\n    ).toBe(true);\n    expect(\n      isCoinbaseTestnetLocalSecurityFallbackAllowed(\n        "/api/goat/pilot/order",\n        "payment",\n      ),\n    ).toBe(false);\n    expect(\n      isCoinbaseTestnetLocalSecurityFallbackAllowed(\n        "/api/agent/risk",\n        "payment",\n      ),\n    ).toBe(false);\n    expect(\n      isCoinbaseTestnetLocalSecurityFallbackAllowed(\n        "/api/x402/risk",\n        "commercial",\n      ),\n    ).toBe(false);\n\n    process.env.COINBASE_X402_ENVIRONMENT = "production";\n    expect(\n      isCoinbaseTestnetLocalSecurityFallbackAllowed(\n        "/api/x402/risk",\n        "payment",\n      ),\n    ).toBe(false);\n  });\n\n'''
              if test.count(needle) != 1:
                  raise SystemExit('test block insertion point not found exactly once')
              test = test.replace(needle, block + needle, 1)

          if 'CENTRAL_SECURITY_TESTNET_LOCAL_DEGRADED_PASS' not in test:
              needle = '''    expect(centralSecurity).toContain(CENTRAL_SECURITY_VERSION);\n'''
              replacement = needle + '''    expect(centralSecurity).toContain("CENTRAL_SECURITY_TESTNET_LOCAL_DEGRADED_PASS");\n    expect(centralSecurity).toContain('coinbaseEnvironment === "testnet"');\n'''
              if test.count(needle) != 1:
                  raise SystemExit('deployment assertion insertion point not found exactly once')
              test = test.replace(needle, replacement, 1)

          test_path.write_text(test)
          PY

      - name: Run focused security tests
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          bunx vitest run src/__tests__/central-security-contract.test.ts

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/lib/central-security.server.ts src/__tests__/central-security-contract.test.ts; then
            exit 0
          fi
          git config user.name 'Geomacro CI Patch'
          git config user.email 'actions@users.noreply.github.com'
          git add src/lib/central-security.server.ts src/__tests__/central-security-contract.test.ts
          git commit -m 'Allow local x402 security fallback on Coinbase testnet only'
          git push origin HEAD:fix/x402-testnet-security-degraded-fallback

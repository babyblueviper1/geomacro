name: Signed GRO B2-only externalization automation

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/b2-only-gro-externalize-canary.yml
      - scripts/ops/b2-only-gro-externalize-canary.ts

permissions:
  contents: read

concurrency:
  group: geomacro-b2-gro-externalization
  cancel-in-progress: false

jobs:
  externalize_verified_batch:
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Externalize up to 25 expired signed GROs, one verified object at a time
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 25); do
            echo "Verified GRO archive iteration ${i}/25"
            output="$(bun scripts/ops/b2-only-gro-externalize-canary.ts)"
            echo "$output"
            if echo "$output" | grep -q '"status":"complete"'; then
              echo "No more eligible signed expired GRO payloads remain."
              break
            fi
          done

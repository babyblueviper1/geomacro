name: B2 observation raw payload maintenance

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: geomacro-b2-observation-payload-maintenance
  cancel-in-progress: false

jobs:
  archive_verified_batch:
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      OBS_ARCHIVE_LIMIT: "10"

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Archive verified observation payloads to B2
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "Observation archive batch ${i}/10"
            output="$(node scripts/ops/b2-archive-observation-payload-batch.mjs)"
            echo "$output"
            archived="$(printf '%s\n' "$output" | jq -r 'select(.ok == true) | .archived' | tail -n1)"
            if [ -z "$archived" ] || [ "$archived" = "0" ]; then
              echo "No more eligible observation payloads in this run."
              break
            fi
          done

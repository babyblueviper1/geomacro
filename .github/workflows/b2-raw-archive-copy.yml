name: B2 raw archive bounded copy

on:
  push:
    branches: [main]
    paths: [.github/workflows/b2-raw-archive-copy.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geomacro-b2-raw-archive-copy
  cancel-in-progress: false

jobs:
  copy_and_verify:
    if: ${{ github.repository == 'blocknine0/geomacro' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      ARCHIVE_BATCH_LIMIT: "10"
      ARCHIVE_OLDER_HOURS: "72"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Copy and read back ten historical raw snapshots
        run: node scripts/ops/b2-archive-raw-batch.mjs

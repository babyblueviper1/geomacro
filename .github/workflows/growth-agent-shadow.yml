name: Geomacro Growth Agent

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Request live compliant zero-cost growth actions"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "config/growth-agent.json"
      - "config/agent-marketplace-distribution.json"
      - "config/auto-distribution.json"
      - "scripts/marketing/run-growth-agent.mjs"
      - ".github/workflows/growth-agent-shadow.yml"

permissions:
  contents: read

jobs:
  growth-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEOMACRO_GROWTH_AGENT_ACK: ${{ secrets.GEOMACRO_GROWTH_AGENT_ACK }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run Growth Agent
        shell: bash
        run: |
          EXTRA=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.live }}" == "true" ]]; then
            EXTRA="--live"
          fi
          node scripts/marketing/run-growth-agent.mjs $EXTRA --out=artifacts/growth-agent/latest-run.json
      - name: Upload Growth Agent evidence
        uses: actions/upload-artifact@v4
        with:
          name: geomacro-growth-agent-run
          path: artifacts/growth-agent/latest-run.json
          if-no-files-found: error
          retention-days: 14

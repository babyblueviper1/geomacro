name: Verify Edge GRO B2 archive once
on:
  push:
    branches: [codex/permanent-gro-b2-maintenance]
    paths:
      - scripts/ops/verify-edge-gro-archive-maintain.ts
      - .github/workflows/verify-edge-gro-archive-maintain.yml
permissions:
  contents: read
jobs:
  archive_and_restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RISK_OBJECT_SIGNING_KEY_ID: ${{ secrets.RISK_OBJECT_SIGNING_KEY_ID }}
      RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.RISK_OBJECT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun scripts/ops/verify-edge-gro-archive-maintain.ts

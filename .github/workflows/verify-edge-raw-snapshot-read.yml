name: Verify B2 raw snapshot Edge restore
on:
  push:
    branches: [codex/permanent-gro-b2-maintenance]
    paths:
      - scripts/ops/verify-edge-raw-snapshot-read.mjs
      - .github/workflows/verify-edge-raw-snapshot-read.yml
permissions:
  contents: read
jobs:
  restore_one:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun scripts/ops/verify-edge-raw-snapshot-read.mjs
